services:
  - type: web
    name: work-reporter
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: MANAGER_EMAIL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: REPORT_DAY
        value: "4"
      - key: REPORT_TIME
        value: "17:00"
      - key: SCHEDULE_TIME
        value: "18:00"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TIMETABLE_EXCEL_URL
        sync: false
      - key: GMAIL_RELAY_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
